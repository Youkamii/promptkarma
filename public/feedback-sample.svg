<svg width="700" height="260" viewBox="0 0 700 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">promptkarma 로컬 스캔 예시</title>
  <desc id="desc">맥락, 조건, 단계 표현의 관찰 비율과 다음 프롬프트에서 시험해볼 한 가지를 보여준다.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17161f"/>
      <stop offset="1" stop-color="#0d0c12"/>
    </linearGradient>
  </defs>
  <rect width="700" height="260" rx="14" fill="url(#bg)"/>
  <rect x=".75" y=".75" width="698.5" height="258.5" rx="13" fill="none" stroke="#fff" stroke-opacity=".12"/>

  <g font-family="'Segoe UI','Malgun Gothic',system-ui,sans-serif">
    <text x="24" y="34" font-size="17" font-weight="800" fill="#c084fc" letter-spacing=".5">PROMPT HABITS</text>
    <text x="676" y="34" font-size="14" text-anchor="end" fill="#8b88a0">LOCAL SCAN</text>
    <text x="24" y="55" font-size="12.5" fill="#8b88a0">관찰 신호이며 능력 평가가 아닙니다</text>

    <g>
      <rect x="24" y="70" width="208" height="88" rx="10" fill="#2a2836" opacity=".55"/>
      <text x="40" y="95" font-size="12" font-weight="700" fill="#8b88a0">맥락 단서</text>
      <text x="40" y="132" font-size="29" font-weight="800" fill="#5eead4">31.3%</text>
      <text x="40" y="149" font-size="10.5" fill="#8b88a0">파일 · 코드 · 링크</text>
    </g>
    <g>
      <rect x="246" y="70" width="208" height="88" rx="10" fill="#2a2836" opacity=".55"/>
      <text x="262" y="95" font-size="12" font-weight="700" fill="#8b88a0">조건 · 기준</text>
      <text x="262" y="132" font-size="29" font-weight="800" fill="#5eead4">18.8%</text>
      <text x="262" y="149" font-size="10.5" fill="#8b88a0">요구사항 · 완료 기준</text>
    </g>
    <g>
      <rect x="468" y="70" width="208" height="88" rx="10" fill="#2a2836" opacity=".55"/>
      <text x="484" y="95" font-size="12" font-weight="700" fill="#8b88a0">단계 · 목록</text>
      <text x="484" y="132" font-size="29" font-weight="800" fill="#5eead4">12.5%</text>
      <text x="484" y="149" font-size="10.5" fill="#8b88a0">목록 항목 2개 이상</text>
    </g>

    <text x="24" y="181" font-size="11.5" fill="#8b88a0">다음에 해볼 한 가지</text>
    <rect x="24" y="190" width="652" height="38" rx="8" fill="#2a2836"/>
    <text x="350" y="215" font-size="14" font-weight="700" text-anchor="middle" fill="#ececf4">큰 요청은 두 단계 이상의 목록으로 나눠 적어보세요.</text>

    <text x="24" y="248" font-size="11.5" fill="#8b88a0">N=128 · RULES F1/M2 · LOCAL SCAN</text>
    <text x="676" y="248" font-size="11.5" text-anchor="end" fill="#8b88a0">말투 참고 · 욕설 어근 1.6%</text>
  </g>
</svg>
